name: Update headlines

on:
  schedule:
    # 11:17, 16:17 and 22:17 UTC = roughly 6:17 AM, 11:17 AM and 5:17 PM Eastern (winter); an hour later on the clock in summer
    - cron: "17 11,16,22 * * *"
  workflow_dispatch:   # lets you run it by hand: Actions tab -> Update headlines -> Run workflow

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build headlines.json from feeds.json
        run: python build_headlines.py

      - name: Commit if changed
        run: |
          git config user.name "newsbrief-bot"
          git config user.email "actions@users.noreply.github.com"
          git add headlines.json
          git diff --cached --quiet || (git commit -m "Update headlines" && git push)

